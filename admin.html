<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Espace de gestion Vite et Gourmand.">
  <title>Espace de gestion - Vite et Gourmand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Vite et Gourmand</a>
    <nav class="main-navigation" aria-label="Navigation principale">
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="menus.html">Menus</a></li>
        <li><a href="api/auth/logout.php">Déconnexion</a></li>
      </ul>
    </nav>
  </header>

  <main class="catalogue-page admin-page">
    <div class="page-intro">
      <p class="eyebrow">Espace professionnel</p>
      <h1>Gestion de l'application</h1>
      <p id="admin-identity">Vérification de votre session...</p>
    </div>

    <section class="form-section" aria-labelledby="menu-management-title">
      <h2 id="menu-management-title">Gérer les menus</h2>
      <form id="menu-management-form" class="grille-formulaire">
        <div class="champ-formulaire"><label for="menu-id">Identifiant</label><input id="menu-id" name="id" required></div>
        <div class="champ-formulaire"><label for="menu-name">Titre</label><input id="menu-name" name="name" required></div>
        <div class="champ-formulaire"><label for="menu-price">Prix</label><input id="menu-price" name="price" type="number" min="0" step="0.01" required></div>
        <div class="champ-formulaire"><label for="menu-minimum">Personnes minimum</label><input id="menu-minimum" name="minimum_people" type="number" min="1" required></div>
        <div class="champ-formulaire"><label for="menu-theme">Thème</label><input id="menu-theme" name="theme" required></div>
        <div class="champ-formulaire"><label for="menu-regime">Régime</label><input id="menu-regime" name="regime" required></div>
        <div class="champ-formulaire"><label for="menu-stock">Stock</label><input id="menu-stock" name="stock" type="number" min="0" required></div>
        <div class="champ-formulaire"><label for="menu-description">Description</label><textarea id="menu-description" name="description" required></textarea></div>
        <button class="button" type="submit">Enregistrer le menu</button>
      </form>
      <p id="menu-feedback" class="message-formulaire" role="status"></p>
      <div id="menu-list" class="catalogue-grid"></div>
    </section>

    <section class="form-section" aria-labelledby="dish-management-title">
      <h2 id="dish-management-title">Gérer les plats et allergènes</h2>
      <form id="dish-management-form" class="grille-formulaire">
        <div class="champ-formulaire"><label for="dish-menu-id">Identifiant du menu</label><input id="dish-menu-id" name="menu_id" required></div>
        <div class="champ-formulaire"><label for="dish-type">Type</label><select id="dish-type" name="dish_type"><option value="entree">Entrée</option><option value="plat">Plat</option><option value="dessert">Dessert</option></select></div>
        <div class="champ-formulaire"><label for="dish-name">Nom du plat</label><input id="dish-name" name="name" required></div>
        <div class="champ-formulaire"><label for="dish-allergens">Allergènes</label><input id="dish-allergens" name="allergens" placeholder="Aucun ou liste des allergènes" required></div>
        <div class="champ-formulaire"><label for="dish-position">Position</label><input id="dish-position" name="position" type="number" min="1" max="3" required></div>
        <button class="button" type="submit">Enregistrer le plat</button>
      </form>
      <div id="dish-feedback" class="message-formulaire" role="status"></div>
    </section>

    <section class="form-section" aria-labelledby="hours-management-title">
      <h2 id="hours-management-title">Gérer les horaires</h2>
      <form id="hours-management-form"></form>
      <p id="hours-feedback" class="message-formulaire" role="status"></p>
    </section>

    <section class="form-section" aria-labelledby="orders-management-title">
      <h2 id="orders-management-title">Commandes</h2>
      <form id="order-filter-form" class="grille-formulaire">
        <div class="champ-formulaire"><label for="order-status-filter">Statut</label><select id="order-status-filter" name="status"><option value="">Tous</option><option value="pending">En attente</option><option value="accepted">Accepté</option><option value="preparing">En préparation</option><option value="delivery">En cours de livraison</option><option value="delivered">Livré</option><option value="material_return">Retour matériel</option><option value="completed">Terminée</option><option value="cancelled">Annulée</option></select></div>
        <div class="champ-formulaire"><label for="order-client-filter">Client</label><input id="order-client-filter" name="email" type="search"></div>
        <button class="button" type="submit">Rechercher</button>
      </form>
      <div id="order-list" class="table-responsive"></div>
    </section>

    <section class="form-section" aria-labelledby="stats-title">
      <h2 id="stats-title">Statistiques MongoDB</h2>
      <form id="stats-filter-form" class="grille-formulaire">
        <div class="champ-formulaire"><label for="stats-from">Du</label><input id="stats-from" name="from" type="date"></div>
        <div class="champ-formulaire"><label for="stats-to">Au</label><input id="stats-to" name="to" type="date"></div>
        <button class="button" type="submit">Actualiser les statistiques</button>
      </form>
      <div id="stats-chart" class="stats-chart" role="img" aria-label="Graphique du nombre de commandes par menu"></div>
      <div id="stats-list" class="table-responsive"></div>
    </section>

    <section id="employee-section" class="form-section" aria-labelledby="employee-management-title" hidden>
      <h2 id="employee-management-title">Comptes employés</h2>
      <form id="employee-form" class="grille-formulaire">
        <div class="champ-formulaire"><label for="employee-email">E-mail</label><input id="employee-email" name="email" type="email" required></div>
        <div class="champ-formulaire"><label for="employee-password">Mot de passe initial</label><input id="employee-password" name="password" type="password" minlength="10" required></div>
        <button class="button" type="submit">Créer le compte employé</button>
      </form>
      <div id="employee-list"></div>
    </section>

    <section class="form-section" aria-labelledby="review-management-title">
      <h2 id="review-management-title">Valider les avis</h2>
      <div id="review-list"></div>
    </section>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
